[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-lantern"
version = "0.2.0"
description = "Offline capability-flow auditor for MCP client configuration files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []
classifiers = ["Topic :: Security", "Environment :: Console", "Programming Language :: Python :: 3"]

[project.scripts]
mcp-lantern = "mcp_lantern.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_lantern = ["catalog.json", "report_template.html"]
